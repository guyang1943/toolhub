name: CI

# PR 不绿不合：这一串命令与本地手动跑的是同一套（没有 npm install，零依赖）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 五套测试 + 性能预算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Python 只被两处「与参考实现对拍」用到：真二维码生成（qrcode + pillow）
      # 和测试用 PNG 生成（pillow）。v3.9 之前脚本里写死了开发机的 Windows 绝对路径，
      # 本地永远绿、CI 一推就 ENOENT。现在由 scripts/lib/python.mjs 解析解释器。
      # 用 setup-python 而不是系统 python3：ubuntu-24.04 的 python3 受 PEP 668 保护，
      # 直接 pip install 会报 externally-managed-environment。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装对拍用 Python 依赖
        run: python -m pip install --quiet --upgrade "qrcode[pil]"

      # 1) 派生文件是否漂移：改了 tool.json 却忘了 sync-tools 会在这里拦下
      - name: 注册表漂移检查
        run: node scripts/sync-tools.mjs --check

      # 2) Manifest 闸门（与 build 内部的检查同源，单独跑一次是为了先失败、报错更集中）
      - name: 清单合规
        run: node scripts/lint-tools.mjs

      - name: 构建静态页
        run: node scripts/build-pages.mjs

      - name: 结构与内容校验
        run: node scripts/verify.mjs

      - name: SPA 渲染
        run: node scripts/spa-render-test.mjs

      - name: 工具功能
        run: node scripts/new-tools-test.mjs

      - name: 性能预算
        run: node scripts/perf-budget.mjs

      - name: 安装 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 3) 需要真实 HTTP + 真实浏览器：起本地服务器（带安全头），跑冒烟与 E2E
      - name: 冒烟 + 真浏览器 E2E
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/serve.mjs --port 8788 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8788/ > /dev/null && break
            sleep 0.25
          done
          node scripts/smoke-test.mjs http://127.0.0.1:8788
          node scripts/browser-test.mjs http://127.0.0.1:8788
          # 全站体检（v3.3 起进 CI）：多视口查横向溢出 / 控制台报错 / CSP / 深色对比度 / 点击区。
          # 这是 v3.2 造出的「找没想到的问题」的机器——不设闸门，修好的问题会被后面的改动悄悄带回来。
          node scripts/audit.mjs http://127.0.0.1:8788 --json audit-report.json

      - name: 上传体检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: ignore

  deploy:
    name: 部署到 Cloudflare Workers
    needs: test
    # 默认不自动部署。要启用：① 在仓库 Secrets 里配 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID；
    # ② 在仓库 Variables 里把 DEPLOY_ENABLED 设为 true（Settings → Secrets and variables → Actions）。
    # 为什么用仓库变量而不是直接判断 secret：GitHub 不允许在 job 级 if 里读 secrets 上下文，
    # 硬判断会让这个作业每次推送都红，把「没配密钥」误报成「代码有问题」。
    # 现状（v3.9）：部署仍走本地 wrangler deploy，CI 只负责把关测试。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # canonical / sitemap 用正式域名：在仓库 Variables 里配 SITE_BASE_URL 即可整体切换
      - name: 构建（使用正式域名）
        run: node scripts/build-pages.mjs "${{ vars.SITE_BASE_URL || 'https://toolhub.guyang1966.workers.dev' }}"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
